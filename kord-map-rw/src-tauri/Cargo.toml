[package]
name = "kord-map-desktop"
version = "0.1.0"
description = "Offline desktop build of KordMap"
authors = ["KordMap contributors"]
license = "CC-BY-NC-SA-4.0"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-fs = "2.5.1"
